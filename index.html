<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>root@homepage</title>
<style>
  :root{
    --bg: #0b0e14;
    --bg-raised: #10141d;
    --line: #1e2531;
    --text: #c7d0dc;
    --text-dim: #5f6b7a;
    --cyan: #5ee6d0;
    --amber: #e6b45e;
    --danger: #e65e5e;
  }
  @font-face {
    font-family: 'FiraCodeFallback';
    src: local('Consolas'), local('Menlo'), local('Monaco');
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'SF Mono','Consolas','Menlo',monospace;
    min-height:100vh;
    line-height:1.7;
  }
  ::selection{ background:var(--cyan); color:#04110d; }

  .crt{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:overlay;
  }

  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:8vh 24px 12vh;
  }

  .titlebar{
    display:flex; align-items:center; gap:8px;
    padding:10px 14px;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:8px 8px 0 0;
  }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.r{ background:var(--danger); }
  .dot.y{ background:var(--amber); }
  .dot.g{ background:var(--cyan); }
  .titlebar span{
    margin-left:8px;
    font-size:12px;
    color:var(--text-dim);
  }

  .term{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:0 0 8px 8px;
    padding:32px 28px 40px;
  }

  .line{ display:flex; gap:10px; margin-bottom:4px; flex-wrap:wrap; }
  .prompt{ color:var(--cyan); white-space:nowrap; }
  .path{ color:var(--amber); }
  .cmd{ color:var(--text); }

  .out{
    color:var(--text);
    padding:6px 0 22px 0;
    font-size:15px;
  }
  .out .comment{ color:var(--text-dim); }

  h1.name{
    font-size:clamp(36px, 8vw, 56px);
    letter-spacing:-1px;
    color:var(--text);
    margin:2px 0 6px;
    font-weight:700;
  }
  h1.name::before{ content:'> '; color:var(--cyan); }
  .cursor{
    display:inline-block;
    width:10px; height:1em;
    background:var(--cyan);
    margin-left:4px;
    vertical-align:text-bottom;
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .section-gap{ height:14px; }

  ul.projects{ list-style:none; padding:0; }
  ul.projects li{
    display:flex;
    align-items:baseline;
    gap:14px;
    padding:14px 0;
    border-bottom:1px dashed var(--line);
  }
  ul.projects li:last-child{ border-bottom:none; }
  ul.projects .perm{ color:var(--text-dim); font-size:13px; width:100px; flex-shrink:0; }
  ul.projects a{
    color:var(--text);
    text-decoration:none;
    font-size:16px;
    font-weight:600;
    position:relative;
  }
  ul.projects a::after{
    content:' →';
    color:var(--cyan);
    opacity:0;
    transition:opacity .15s;
  }
  ul.projects a:hover, ul.projects a:focus-visible{
    color:var(--cyan);
  }
  ul.projects a:hover::after, ul.projects a:focus-visible::after{ opacity:1; }
  ul.projects .desc{
    display:block;
    color:var(--text-dim);
    font-size:13px;
    margin-top:2px;
  }
  a:focus-visible{ outline:2px solid var(--cyan); outline-offset:3px; }

  footer{
    margin-top:34px;
    padding-top:18px;
    border-top:1px solid var(--line);
    color:var(--text-dim);
    font-size:12px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  footer .prompt{ color:var(--cyan); }

  @media (max-width:520px){
    .wrap{ padding:6vh 14px 10vh; }
    .term{ padding:24px 18px 32px; }
    ul.projects li{ flex-direction:column; gap:2px; }
    ul.projects .perm{ width:auto; }
  }

  @media (prefers-reduced-motion: reduce){
    .cursor{ animation:none; opacity:1; }
  }
</style>
</head>
<body>
  <div class="crt" aria-hidden="true"></div>
  <div class="wrap">

    <div class="titlebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span>root@homepage — zsh</span>
    </div>

    <div class="term">

      <div class="line">
        <span class="prompt">root@homepage</span><span class="path">:~$</span>
        <span class="cmd">whoami</span>
      </div>
      <h1 class="name">root<span class="cursor" aria-hidden="true"></span></h1>

      <div class="section-gap"></div>

      <div class="line">
        <span class="prompt">root@homepage</span><span class="path">:~$</span>
        <span class="cmd">cat about.txt</span>
      </div>
      <div class="out">热爱开源设计。<span class="comment">// 相信好的代码和好的界面一样值得打磨</span></div>

      <div class="line">
        <span class="prompt">root@homepage</span><span class="path">:~$</span>
        <span class="cmd">ls -la ./works</span>
      </div>

      <ul class="projects">
        <li>
          <span class="perm">-rwxr-xr-x</span>
          <a href="https://github.com" target="_blank" rel="noopener noreferrer">
            project-one
            <span class="desc">占位链接 · 替换为你的 GitHub 仓库地址</span>
          </a>
        </li>
        <li>
          <span class="perm">-rwxr-xr-x</span>
          <a href="https://github.com" target="_blank" rel="noopener noreferrer">
            project-two
            <span class="desc">占位链接 · 替换为你的 GitHub 仓库地址</span>
          </a>
        </li>
      </ul>

      <footer>
        <span><span class="prompt">$</span> echo "感谢来访"</span>
        <span>© 2026 root</span>
      </footer>

    </div>
  </div>
</body>
</html>
